name: Orchard verification bridge

on:
  push:
    branches: [private-transactions]
    paths:
      - "crypto/orchard-ffi/**"
      - "CMakeLists.txt"
      - "core/include/onuros/orchard_ffi_backend.hpp"
      - "core/include/onuros/private_transaction.hpp"
      - "core/include/onuros/private_block.hpp"
      - "tests/orchard_ffi_backend_test.cpp"
      - "tests/private_block_test.cpp"
      - "scripts/run-private-tps.sh"
      - ".github/workflows/orchard-ffi.yml"
  pull_request:
    paths:
      - "crypto/orchard-ffi/**"
      - "CMakeLists.txt"
      - "core/include/onuros/orchard_ffi_backend.hpp"
      - "core/include/onuros/private_transaction.hpp"
      - "core/include/onuros/private_block.hpp"
      - "tests/orchard_ffi_backend_test.cpp"
      - "tests/private_block_test.cpp"
      - "scripts/run-private-tps.sh"
      - ".github/workflows/orchard-ffi.yml"

permissions:
  contents: read

jobs:
  rust-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test pinned Orchard bridge
        run: cargo test --locked --manifest-path crypto/orchard-ffi/Cargo.toml
      - name: Build release bridge
        run: cargo build --locked --manifest-path crypto/orchard-ffi/Cargo.toml --release
      - name: Smoke test real private TPS harness
        run: ./scripts/run-private-tps.sh 1 1
      - name: Link C++ consensus boundary to Orchard bridge
        run: |
          cmake -S . -B build-orchard \
            -DCMAKE_BUILD_TYPE=Release \
            -DONUROS_ORCHARD_FFI_LIBRARY="$PWD/crypto/orchard-ffi/target/release/libonuros_orchard_ffi.so"
          cmake --build build-orchard --parallel
          ctest --test-dir build-orchard --output-on-failure
      - name: Preserve dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: orchard-cargo-lock
          path: crypto/orchard-ffi/Cargo.lock
