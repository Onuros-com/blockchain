[package]
name = "onuros-orchard-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Onuros-Community-1.0"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
nonempty = "0.11"
orchard = { git = "https://github.com/zcash/orchard.git", rev = "f2be3a479837df6583110fd44e124d155ec592ee", features = ["test-dependencies"] }

[dev-dependencies]
proptest = "1.6"
rand = "0.8"
